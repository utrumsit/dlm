[tool.poetry]
name = "dlm"
version = "0.2.0"
description = "Cross-platform CLI for managing a personal DDC-organized digital library"
authors = ["Karl Schudt"]
license = "MIT"
readme = "README.md"
packages = [{include = "dlm", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
google-genai = "^1.0.0"
google-auth = ">=2.0.0"
google-auth-oauthlib = ">=1.0.0"
wordninja = "^2.0.0"
tomli = {version = "^2.0", python = "<3.11"}
tomli-w = "^1.0"
pyperclip = "^1.8"

[tool.poetry.scripts]
dlm = "dlm.cli:main"
dlm-catalog = "dlm.catalog:main"
dlm-sort = "dlm.sort:main"
dlm-init = "dlm.init:main"
dlm-toc = "dlm.toc:main"
dlm-auth = "dlm.auth:auth_command"
dlm-metafix = "dlm.metafix:main"
dlm-config = "dlm.config_cli:main"
dlm-doctor = "dlm.doctor:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
